<app-header></app-header>

<main>
    <ul id="users">

        @for (user of users; track user.id) {
        <li>
            <app-user [user]="user" (select)="onSelectUser($event)" [selected]="user.id === selectedUserId" />
        </li>
        }
    </ul>

    <section id="route-content">
        <router-outlet />
    </section>
</main>
